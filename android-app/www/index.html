<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AeroVault</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0B0F19;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .logo-box {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4);
    }
    .title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .title span {
      background: linear-gradient(135deg, #6366F1, #A855F7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #94A3B8;
      margin-bottom: 24px;
      max-width: 280px;
      line-height: 1.5;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366F1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-text {
      font-size: 0.8rem;
      color: #64748B;
    }
    .retry-btn {
      display: none;
      margin-top: 16px;
      padding: 10px 20px;
      background: linear-gradient(135deg, #4F46E5, #7C3AED);
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    .credits {
      position: absolute;
      bottom: 24px;
      font-size: 0.75rem;
      color: #64748B;
    }
    .credits strong {
      color: #94A3B8;
    }
  </style>
</head>
<body>
  <div class="logo-box">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
      <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
      <line x1="12" y1="22.08" x2="12" y2="12"></line>
    </svg>
  </div>
  <h1 class="title">Aero<span>Vault</span></h1>
  <p class="subtitle">Connecting to your personal cloud drive...</p>
  <div class="spinner" id="spinner"></div>
  <div class="status-text" id="statusText">Establishing secure link</div>
  <button class="retry-btn" id="retryBtn" onclick="location.reload()">Retry Connection</button>

  <div class="credits">Crafted by <strong>Devanarayanan</strong></div>

  <script>
    // Configurable server endpoint (Koyeb or local testing)
    const SERVER_URL = window.AEROVAULT_SERVER_URL || "https://aerovault.koyeb.app";

    function checkConnection() {
      fetch(SERVER_URL + "/api/info", { mode: 'cors' })
        .then(res => {
          if (res.ok) {
            window.location.href = SERVER_URL;
          } else {
            showError("Server returned an error status.");
          }
        })
        .catch(err => {
          // If offline or unreachable
          setTimeout(() => {
            // Attempt direct redirection in case CORS preflight is blocked on /api/info
            window.location.href = SERVER_URL;
          }, 1500);
        });
    }

    function showError(msg) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('statusText').textContent = msg;
      document.getElementById('retryBtn').style.display = 'inline-block';
    }

    // Auto-connect on load
    setTimeout(checkConnection, 800);
  </script>
</body>
</html>
